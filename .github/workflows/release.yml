name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # No registry-url: it writes an .npmrc with _authToken=${NODE_AUTH_TOKEN} (a placeholder when no
          # secret is set), and a token in .npmrc stops npm from exchanging the OIDC id-token → E404 on publish.

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: npm install -g npm@latest

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
